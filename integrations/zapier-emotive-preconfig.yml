arazzo: 1.0.1
info:
  title: 'zapier through emotive: controllers.webhooks.post preconfigured with zapier'
  summary: Calls emotive's controllers.webhooks.post with `zapier` preset, the way zapier is used inside emotive.
  description: 'A PRECONFIGURATION, not an orchestration: zapier is a processor-connection inside emotive, so the
    integration is emotive''s own operation with zapier''s enum value set. Derived from emotive''s contract (emotive-webhooks-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: emotive
  relationship: processor-connection
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/emotive/blob/main/openapi/emotive-webhooks-api-openapi.yml
  edge_type: contract
  preset:
    platform: zapier
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: emotiveWebhooksApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/emotive/refs/heads/main/openapi/emotive-webhooks-api-openapi.yml
  type: openapi
workflows:
- workflowId: zapier-via-emotive-controllers-webhooks-post
  summary: controllers.webhooks.post with zapier preset
  inputs:
    type: object
    required:
    - status
    - webhook_url
    - trigger
    properties:
      status:
        type: string
      webhook_url:
        type: string
      trigger:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.emotiveWebhooksApiOpenapi.controllers.webhooks.post
    requestBody:
      contentType: application/json
      payload:
        status: $inputs.status
        webhook_url: $inputs.webhook_url
        trigger: $inputs.trigger
        platform: zapier
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
