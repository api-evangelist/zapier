    post:
      operationId: create-authentication
      description: 'Creates a new Authentication for the provided App. See our Adding an Authentication guide to get started.


        #### When using OAuth


        This endpoint requires the `connection:write` OAuth scope.'
      summary: Zapier Create Authentication
      tags:
      - Authentications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationCreateRequest'
            examples:
              NewAuthentication:
                value:
                  data:
                    title: My new auth
                    app: 8cdbc496-c95c-4f19-b3a3-fee03ed5f924
                    authentication_fields:
                      secret: example_E4CrHVvRuxTXrPFLyyZFeRJwJcx2ELQZ
                summary: New Authentication
        required: true
      security:
      - OAuth:
        - connection:write
      responses:
